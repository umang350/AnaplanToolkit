# Publishes a GitHub release for the version in manifest.json, when its notes
# (.github/release-notes/<version>.md) reach master - or by hand from the Actions
# tab (Run workflow). The notes' first line, "# <title>", is the release title
# (after the version); the rest is the body. It builds both packages with
# package.sh, tags the commit and uploads the two zips. A tag made beforehand is
# used as it is (the zips are built from it); a version that already has a
# release is skipped, so editing old notes does nothing. The store uploads stay manual.
name: Release

on:
  push:
    branches: [master]
    paths: ['.github/release-notes/**', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find the version and its notes
        id: v
        run: |
          V=$(jq -r .version manifest.json)
          N=".github/release-notes/$V.md"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if [ ! -f "$N" ]; then echo "No notes for $V ($N) - nothing to release."; exit 0; fi
          if gh release view "$V" >/dev/null 2>&1; then echo "$V is already released - nothing to do."; exit 0; fi
          head -n1 "$N" | grep -q '^# ' || { echo "$N must start with '# <title>'" >&2; exit 1; }
          echo "title=$(head -n1 "$N" | sed 's/^# *//')" >> "$GITHUB_OUTPUT"
          tail -n +2 "$N" | sed '/./,$!d' > "$RUNNER_TEMP/notes.md"
          # Tagged already (by hand): build from the tag, which must be at this version too.
          if git ls-remote --exit-code --tags origin "refs/tags/$V" >/dev/null; then
            git fetch -q --depth=1 origin "refs/tags/$V:refs/tags/$V" && git checkout -q "$V"
            t=$(jq -r .version manifest.json)
            [ "$t" = "$V" ] || { echo "tag $V has manifest.json at $t" >&2; exit 1; }
            echo "tagged=1" >> "$GITHUB_OUTPUT"
          fi
          echo "go=1" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build the packages
        if: steps.v.outputs.go == '1'
        run: sh package.sh

      - name: Tag and publish the release
        if: steps.v.outputs.go == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.version }}
          TITLE: ${{ steps.v.outputs.title }}
          TAGGED: ${{ steps.v.outputs.tagged }}
        run: |
          if [ "$TAGGED" = 1 ]; then at="--verify-tag"; else at="--target $GITHUB_SHA"; fi
          gh release create "$V" anaplan-toolkit.zip anaplan-toolkit-firefox.zip \
            $at --title "$V: $TITLE" --notes-file "$RUNNER_TEMP/notes.md"
