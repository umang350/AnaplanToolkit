# Publishes a GitHub release: run it from the Actions tab (Run workflow) on master.
# It checks manifest.json is at the version given, builds both packages with
# package.sh, then tags the commit and uploads the two zips with the notes in
# .github/release-notes/<version>.md. The store uploads stay manual.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release - must match manifest.json (e.g. 2.9.0)
        required: true
      title:
        description: Release title after the version (e.g. "Delete whole modules")
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      V: ${{ inputs.version }}
      TITLE: ${{ inputs.title }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the version and notes
        run: |
          m=$(jq -r .version manifest.json)
          [ "$m" = "$V" ] || { echo "manifest.json is at $m, not $V" >&2; exit 1; }
          [ -f ".github/release-notes/$V.md" ] || { echo "missing .github/release-notes/$V.md" >&2; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/$V" >/dev/null; then echo "tag $V already exists" >&2; exit 1; fi

      - name: Build the packages
        run: sh package.sh

      - name: Tag and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$V" anaplan-toolkit.zip anaplan-toolkit-firefox.zip \
            --target "$GITHUB_SHA" --title "$V: $TITLE" --notes-file ".github/release-notes/$V.md"
