<!DOCTYPE html>
<!--
  Anaplan Toolkit
  Author: Umang Chauhan
-->
<html lang="en">
    <head>
        <title>Anaplan Toolkit</title>
        <meta charset="UTF-8">
      <link rel="stylesheet" crossorigin href="/assets/style-DoRxNK32.css">
      <link rel="stylesheet" href="/sidepanel.css">
      <script src="/sidepanel.js" defer></script>
    </head>
    <body>
        <header id="bar">
            <nav id="tabs" role="tablist" aria-label="Anaplan Toolkit views"></nav>
            <button id="refresh" type="button" hidden aria-label="Refresh">
                <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
            </button>
        </header>
        <main id="views">
            <section id="empty" hidden>
                <h1 id="empty-title"></h1>
                <p id="empty-desc"></p>
                <button id="empty-load" type="button"></button>
                <p id="empty-note"></p>
            </section>
            <section id="progress" hidden>
                <p id="progress-head"></p>
                <ol id="steps"></ol>
            </section>
        </main>
        <footer id="brand">
            <span id="brand-mark" aria-hidden="true">AT</span>
            <span id="brand-text">
                <strong>Anaplan</strong> &middot; Toolkit
            </span>
            <span id="brand-by">Umang&nbsp;Chauhan</span>
        </footer>
    </body>
</html>
